[project]
name = "sony-bdp-ip"
version = "0.1.0"
description = "IP control client for Sony BDP-CE Blu-ray players (e.g. UBP-X700)"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Kevin Clark" }]
requires-python = ">=3.11"
dependencies = ["requests"]
keywords = ["sony", "blu-ray", "ubp-x700", "home-assistant", "ircc", "cers", "dial"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest", "build", "twine"]

[project.urls]
Homepage = "https://github.com/kevinclark/sony-bdp-ip"
Issues = "https://github.com/kevinclark/sony-bdp-ip/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sony_bdp_ip*"]

[tool.setuptools.package-data]
sony_bdp_ip = ["py.typed"]
